# API + MongoDB.
#   docker compose -f docker-compose.mongodb.yml up --build
# JWT_SECRET and SUPERADMIN_PASSWORD are read from the .env in this folder.
name: email-pixel-tracker-mongodb

services:
  mongodb:
    image: mongo:8
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_DRIVER: mongodb
      DB_DSN: mongodb://mongodb:27017
      DB_NAME: email_pixel_tracker
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:-1h}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      DOCS_PATH: ${DOCS_PATH:-}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Internal only (not published); see docker-compose.observability.yml.
      METRICS_ADDR: ":9464"
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-false}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}

volumes:
  mongodb-data:
