# Admin panel only, for an API that is already running (for example with
# build.bat / build.sh on this machine):
#   docker compose up --build        (from this folder)
#   http://localhost:3000
#
# To start the API, a database and the panel together, use the files in the
# project root instead:
#   docker compose -f docker-compose.postgres.yml -f docker-compose.admin.yml up --build
name: email-pixel-tracker-admin

services:
  admin:
    build: .
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    environment:
      # host.docker.internal is the machine running Docker.
      API_URL: ${API_URL:-http://host.docker.internal:8080}
      PIXEL_BASE_URL: ${PIXEL_BASE_URL:-http://localhost:8080}
      # Plain HTTP on localhost; use true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    extra_hosts:
      # Makes host.docker.internal work on Linux too.
      - "host.docker.internal:host-gateway"
