# API + MySQL.
#   docker compose -f docker-compose.mysql.yml up --build
# JWT_SECRET and SUPERADMIN_PASSWORD are read from the .env in this folder.
name: email-pixel-tracker-mysql

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: email_pixel_tracker
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP check: during initialization the server runs without networking.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_DRIVER: mysql
      # parseTime=true is required.
      DB_DSN: "root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/email_pixel_tracker?parseTime=true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:-1h}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      DOCS_PATH: ${DOCS_PATH:-}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Internal only (not published); see docker-compose.observability.yml.
      METRICS_ADDR: ":9464"
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-false}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}

volumes:
  mysql-data:
